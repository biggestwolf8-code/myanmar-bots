<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat GPT Plus API</title>
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="Chat GPT Plus API — your AI co-worker, powered by OpenAI API.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<style>
  :root {
    --accent: #4f46e5; --accent-dark: #3730a3;
    --bg: #faf9f7; --card: #ffffff; --ink: #1f2937; --muted: #6b7280; --line: #e4e2f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Myanmar", "Noto Sans Thai", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #eef0ff 0%, var(--bg) 55%);
    color: var(--ink); height: 100dvh; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }

  /* ---------- login ---------- */
  #login { margin: auto; width: min(92vw, 400px); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 36px 30px 28px; text-align: center; box-shadow: 0 12px 40px rgba(79,70,229,.10); }
  #login .logo { width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; box-shadow: 0 6px 18px rgba(79,70,229,.35); }
  #login h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -.3px; }
  #login .tagline { color: var(--muted); font-size: 14px; margin: 0 0 22px; line-height: 1.5; }
  #login input { width: 100%; padding: 13px 14px; font-size: 16px; border: 1.5px solid var(--line); border-radius: 12px; text-transform: uppercase; letter-spacing: 3px; text-align: center; margin-bottom: 12px; transition: border-color .15s; }
  #login input:focus { outline: none; border-color: var(--accent); }
  #login button { width: 100%; padding: 13px; font-size: 16px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; border: 0; border-radius: 12px; cursor: pointer; font-weight: 700; box-shadow: 0 4px 14px rgba(79,70,229,.30); }
  #login button:disabled { opacity: .6; }
  #login button:hover:not(:disabled) { filter: brightness(1.08); }
  #loginErr { color: #dc2626; font-size: 13px; min-height: 20px; margin-top: 10px; }
  .powered { margin-top: 18px; font-size: 12px; color: var(--muted); letter-spacing: .2px; }
  .powered strong { color: var(--ink); font-weight: 600; }

  /* ---------- chat ---------- */
  header { background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 11px; }
  header .dot { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 19px; box-shadow: 0 3px 10px rgba(79,70,229,.30); }
  header .title { font-weight: 700; font-size: 16px; letter-spacing: -.2px; display: flex; align-items: center; gap: 8px; }
  header .pill { font-size: 10.5px; font-weight: 700; color: var(--accent-dark); background: #eef0ff; border: 1px solid #c9cdf7; padding: 2px 8px; border-radius: 20px; letter-spacing: .4px; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  header button { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 7px 13px; font-size: 13px; cursor: pointer; color: var(--ink); font-weight: 600; }
  header button:hover { background: #f4f3fb; }
  #msgs { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { max-width: 86%; padding: 11px 15px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-wrap: break-word; animation: fadeUp .25s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; border-bottom-right-radius: 5px; box-shadow: 0 3px 10px rgba(79,70,229,.22); }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .msg.bot p { margin: 0 0 9px; } .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot ul { margin: 4px 0 9px; padding-left: 20px; }
  .msg.bot li { margin-bottom: 3px; }
  .msg.bot code { background: #f1f0fa; padding: 1px 6px; border-radius: 5px; font-size: 13px; }
  .msg.bot pre { background: #1f2937; color: #f9fafb; padding: 11px 13px; border-radius: 10px; overflow-x: auto; font-size: 13px; }
  .msg.bot pre code { background: none; padding: 0; }
  .filebtn { display: inline-flex; align-items: center; gap: 8px; margin-top: 9px; padding: 10px 15px; background: #eef0ff; border: 1px solid #b9bef5; color: #3730a3; border-radius: 11px; text-decoration: none; font-size: 14px; font-weight: 700; }
  .filebtn:hover { background: #e0e4ff; }
  .typing { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 17px; color: var(--muted); font-size: 14px; }
  .typing span { animation: blink 1.2s infinite; } .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
  #composer { border-top: 1px solid var(--line); background: rgba(255,255,255,.95); backdrop-filter: blur(8px); padding: 12px 16px 8px; }
  #composer .row { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  #composer input { flex: 1; padding: 13px 16px; font-size: 16px; border: 1.5px solid var(--line); border-radius: 14px; transition: border-color .15s, box-shadow .15s; }
  #composer input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  #composer button { padding: 0 24px; font-size: 15px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; border: 0; border-radius: 14px; cursor: pointer; font-weight: 700; box-shadow: 0 3px 10px rgba(79,70,229,.28); }
  #composer button:disabled { opacity: .6; }
  #foot { text-align: center; font-size: 11.5px; color: var(--muted); padding: 8px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.95); letter-spacing: .2px; }
  #foot strong { font-weight: 600; color: #57534e; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="logo">G</div>
  <h1>Chat GPT Plus API</h1>
  <p class="tagline">Your AI co-worker for drafting, writing, translating,<br>planning and more.</p>
  <input id="codeInput" placeholder="INVITE CODE" maxlength="16" autocomplete="off">
  <button id="redeemBtn" onclick="redeem()">Start chatting</button>
  <div id="loginErr"></div>
  <div class="powered">Powered by <strong>OpenAI</strong></div>
</div>

<div id="chat" class="hidden" style="display:flex;flex-direction:column;height:100dvh;">
  <header>
    <div class="dot">G</div>
    <div>
      <div class="title">Chat GPT Plus API <span class="pill">API</span></div>
      <div class="sub">your AI co-worker</div>
    </div>
    <div class="spacer"></div>
    <button onclick="newChat()">+ New chat</button>
    <button onclick="logout()">Log out</button>
  </header>
  <div id="msgs"></div>
  <div id="composer">
    <div class="row">
      <input id="msgInput" placeholder="Ask anything…" autocomplete="off" onkeydown="if(event.key==='Enter')send()">
      <button id="sendBtn" onclick="send()">Send</button>
    </div>
  </div>
  <div id="foot">Powered by <strong>OpenAI</strong></div>
</div>

<script>
const loginErr = {{ error|default(None)|tojson }};
if (loginErr) { document.getElementById('loginErr').textContent = loginErr; }

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(text){
  let h = esc(text);
  h = h.replace(/```[\s\S]*?```/g, m => '<pre><code>'+m.slice(3,-3).replace(/^\w+\n/,'')+'</code></pre>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = h.split('\n'); let out = '', inList = false;
  for (const ln of lines){
    if (/^\s*[-*] /.test(ln)){
      if (!inList){ out += '<ul>'; inList = true; }
      out += '<li>'+ln.replace(/^\s*[-*] /,'')+'</li>';
    } else {
      if (inList){ out += '</ul>'; inList = false; }
      if (/^#{1,3} /.test(ln)) out += '<p><strong>'+ln.replace(/^#{1,3} /,'')+'</strong></p>';
      else if (ln.trim()==='') out += '';
      else if (ln.startsWith('<pre>')) out += ln;
      else out += '<p>'+ln+'</p>';
    }
  }
  if (inList) out += '</ul>';
  return out || '<p></p>';
}
function addMsg(who, text, files){
  const d = document.createElement('div');
  d.className = 'msg '+who;
  d.innerHTML = who==='bot' ? fmt(text) : esc(text);
  if (files) for (const f of files){
    const a = document.createElement('a');
    a.className = 'filebtn'; a.href = '/files/'+f.id;
    a.textContent = (f.mime.includes('sheet')||f.name.endsWith('.xlsx') ? '📊 ' : '📄 ') + f.name;
    a.setAttribute('download','');
    d.appendChild(document.createElement('br')); d.appendChild(a);
  }
  const box = document.getElementById('msgs');
  box.appendChild(d); box.scrollTop = box.scrollHeight;
  return d;
}
async function boot(){
  const r = await fetch('/api/me');
  const j = await r.json();
  document.getElementById('login').classList.toggle('hidden', j.ok);
  document.getElementById('chat').classList.toggle('hidden', !j.ok);
  if (j.ok && !window._welcomed){
    window._welcomed = true;
    addMsg('bot', "👋 Hi! I'm your AI co-worker, powered by OpenAI API.\n\nAsk me anything — drafting, writing, translations, planning, ideas. I can also make Excel spreadsheets and PDF files, just ask!");
    document.getElementById('msgInput').focus();
  }
}
async function redeem(){
  const code = document.getElementById('codeInput').value.trim();
  const btn = document.getElementById('redeemBtn');
  btn.disabled = true;
  const r = await fetch('/api/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
  const j = await r.json();
  btn.disabled = false;
  if (j.ok) boot();
  else document.getElementById('loginErr').textContent = j.error || 'Something went wrong.';
}
let sending = false;
async function send(){
  if (sending) return;
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text) return;
  sending = true; document.getElementById('sendBtn').disabled = true;
  addMsg('user', text); inp.value = '';
  const t = document.createElement('div'); t.className='typing'; t.innerHTML='<span>●</span> <span>●</span> <span>●</span>';
  const box = document.getElementById('msgs'); box.appendChild(t); box.scrollTop = box.scrollHeight;
  try {
    const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const j = await r.json();
    t.remove();
    if (j.ok) addMsg('bot', j.reply, j.files);
    else addMsg('bot', '⚠️ '+(j.error||'Something went wrong.'));
  } catch(e){ t.remove(); addMsg('bot','⚠️ Connection error — try again.'); }
  sending = false; document.getElementById('sendBtn').disabled = false;
  document.getElementById('msgInput').focus();
}
async function newChat(){
  await fetch('/api/new',{method:'POST'});
  document.getElementById('msgs').innerHTML = '';
  addMsg('bot','✨ Fresh start! What would you like to work on?');
}
async function logout(){ await fetch('/api/logout',{method:'POST'}); location.reload(); }
document.getElementById('codeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') redeem(); });
boot();
</script>
</body>
</html>
