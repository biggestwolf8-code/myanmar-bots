<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Invoice Maker{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="phone">
  <header class="appbar">
    <a class="iconbtn" href="/settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h.09a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h.09a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.09a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></a>
    <h1>{% block apptitle %}Invoices{% endblock %}</h1>
    <button class="iconbtn" id="searchbtn" aria-label="Search" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
  </header>
  {% block presearch %}{% endblock %}
  <main class="content">
    {% if msg %}<div class="flash ok">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block fab %}
  <button class="fab" id="fab" type="button" aria-label="New document"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="sheet-bd" id="sheetbd" hidden></div>
  <div class="sheet" id="sheet" hidden>
    <a href="/docs/new?type=invoice">New invoice</a>
    <a href="/docs/new?type=estimate">New estimate</a>
    <a href="/docs/new?type=receipt">New receipt</a>
    <button type="button" id="sheetclose">Cancel</button>
  </div>
  <script>
  (function(){
    var fab = document.getElementById("fab"),
        sheet = document.getElementById("sheet"),
        bd = document.getElementById("sheetbd"),
        close = document.getElementById("sheetclose");
    function open(){ sheet.hidden = false; bd.hidden = false; }
    function hide(){ sheet.hidden = true; bd.hidden = true; }
    if (fab) fab.addEventListener("click", open);
    if (bd) bd.addEventListener("click", hide);
    if (close) close.addEventListener("click", hide);
    var sb = document.getElementById("searchbtn"),
        bar = document.getElementById("searchbar");
    if (sb) {
      if (!bar) { sb.style.visibility = "hidden"; }
      else sb.addEventListener("click", function(){
        bar.hidden = !bar.hidden;
        if (!bar.hidden) { var i = bar.querySelector("input"); if (i) i.focus(); }
      });
    }
  })();
  </script>
  {% endblock %}
</div>
<nav class="tabbar">
  <a href="/" class="{% if activetab == 'invoices' %}active{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h12V22l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8h5"/><path d="M9.5 12h5"/></svg>Invoices</a>
  <a href="/estimates" class="{% if activetab == 'estimates' %}active{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Estimates</a>
  <a href="/expenses" class="{% if activetab == 'expenses' %}active{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10.5h18"/><path d="M7 15h4"/></svg>Expenses</a>
  <a href="/reports" class="{% if activetab == 'reports' %}active{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-8"/><path d="M11 20V5"/><path d="M17 20v-5"/><path d="M2.5 20h19"/></svg>Reports</a>
  <a href="/more" class="{% if activetab == 'more' %}active{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>More</a>
</nav>
<script src="/static/datepicker.js"></script>
</body>
</html>
