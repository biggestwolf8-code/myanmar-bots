<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ app_name }}</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a0f; --panel: #121218; --panel2: #1a1a24; --line: #26263a;
    --txt: #fff; --dim: #9a9ab0; --acc1: #7c3aed; --acc2: #06b6d4;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--txt);
         font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  a { color: inherit; }

  /* ---------- layout ---------- */
  #app { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 250px; flex-shrink: 0; background: var(--panel);
             border-right: 1px solid var(--line); display: flex; flex-direction: column;
             padding: 18px 12px; gap: 4px; z-index: 40; }
  #main { flex: 1; min-width: 0; overflow-y: auto; padding: 24px 28px 40px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; }
  .brand .logo { width: 36px; height: 36px; border-radius: 10px;
                 background: linear-gradient(135deg, var(--acc1), var(--acc2));
                 display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .brand b { font-size: 18px; }
  .navbtn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px;
            border: none; background: none; color: var(--dim); font-size: 15px; font-weight: 600;
            border-radius: 8px; cursor: pointer; text-align: left; }
  .navbtn:hover { color: #fff; background: var(--panel2); }
  .navbtn.active { color: #fff; background: var(--panel2); }
  .pl-head { display: flex; align-items: center; justify-content: space-between;
             padding: 14px 10px 6px; color: var(--dim); font-size: 12px;
             text-transform: uppercase; letter-spacing: 1px; }
  .pl-head button { background: none; border: 1px solid var(--line); color: var(--dim);
                    border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .pl-head button:hover { color: #fff; border-color: var(--acc1); }
  #pllist { overflow-y: auto; }
  .plitem { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
            cursor: pointer; color: var(--dim); font-size: 14px; }
  .plitem:hover { background: var(--panel2); color: #fff; }
  .plitem.active { background: var(--panel2); color: #fff; }
  .plitem .x { margin-left: auto; opacity: 0; border: none; background: none; color: var(--dim);
               cursor: pointer; font-size: 14px; padding: 2px 6px; }
  .plitem:hover .x { opacity: 1; }
  .plitem .x:hover { color: #ff8080; }

  /* ---------- main ---------- */
  #topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  #menuBtn { display: none; background: var(--panel2); border: 1px solid var(--line); color: #fff;
             border-radius: 8px; padding: 8px 12px; font-size: 16px; cursor: pointer; }
  #search { flex: 1; max-width: 420px; padding: 11px 16px; border-radius: 999px;
            border: 1px solid var(--line); background: var(--panel2); color: #fff; font-size: 14px; }
  #search:focus { outline: none; border-color: var(--acc1); }
  #viewTitle { font-size: 24px; font-weight: 800; margin: 6px 0 2px; }
  #viewSub { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  .vhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #dlAllBtn { background: linear-gradient(135deg,#7c5cff,#00c6ff); border: none; color: #fff;
              font-weight: 700; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 13px; }
  #dlAllBtn:disabled { opacity: .75; cursor: default; }
  table.tracks { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.tracks th { text-align: left; color: var(--dim); font-size: 11px; text-transform: uppercase;
                    letter-spacing: 1px; padding: 8px 10px; border-bottom: 1px solid var(--line);
                    font-weight: 600; }
  table.tracks td { padding: 8px 10px; border-bottom: 1px solid #1c1c28; vertical-align: middle; }
  table.tracks tr.row { cursor: pointer; }
  table.tracks tr.row:hover td { background: var(--panel2); }
  table.tracks tr.playing td { color: #c4b5fd; }
  .t-title { font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .t-num { color: var(--dim); width: 22px; text-align: right; font-size: 12px; flex-shrink: 0; }
  tr.playing .t-num { color: var(--acc2); }
  .t-artist, .t-album, .t-dur { color: var(--dim); }
  .mini-cover { width: 38px; height: 38px; border-radius: 6px; flex-shrink: 0;
                display: flex; align-items: center; justify-content: center;
                font-weight: 800; font-size: 16px; color: rgba(255,255,255,.92); }
  .addbtn { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 50%;
            width: 28px; height: 28px; cursor: pointer; font-size: 16px; line-height: 1; }
  .addbtn:hover { color: #fff; border-color: var(--acc1); }
  .rmlink { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 13px; }
  .rmlink:hover { color: #ff8080; }
  .empty { color: var(--dim); text-align: center; padding: 60px 20px; font-size: 15px; }

  /* add-to-playlist menu */
  #plmenu { position: fixed; background: #1e1e2c; border: 1px solid var(--line); border-radius: 10px;
            padding: 6px; min-width: 190px; box-shadow: 0 10px 30px rgba(0,0,0,.6); display: none; z-index: 100; }
  #plmenu button { display: block; width: 100%; text-align: left; background: none; border: none;
                   color: #fff; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #plmenu button:hover { background: var(--acc1); }

  /* ---------- player ---------- */
  #player { background: var(--panel); border-top: 1px solid var(--line);
            padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
            display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; gap: 12px; }
  #now { display: flex; align-items: center; gap: 12px; min-width: 0; }
  #nowCover { width: 52px; height: 52px; border-radius: 8px; flex-shrink: 0;
              display: flex; align-items: center; justify-content: center;
              font-weight: 800; font-size: 22px; color: rgba(255,255,255,.92);
              background: var(--panel2); }
  #nowMeta { min-width: 0; }
  #nowTitle { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nowArtist { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #controls { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #buttons { display: flex; align-items: center; gap: 18px; }
  .cbtn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 17px; padding: 4px; }
  .cbtn:hover { color: #fff; }
  .cbtn.on { color: var(--acc2); }
  #playBtn { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
             background: #fff; color: #000; font-size: 17px; display: flex;
             align-items: center; justify-content: center; }
  #playBtn:hover { transform: scale(1.05); }
  #seekrow { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 560px; }
  #seekrow span { color: var(--dim); font-size: 11px; min-width: 36px; text-align: center; }
  #seek { flex: 1; appearance: none; -webkit-appearance: none; height: 5px; border-radius: 3px;
          background: #33334d; cursor: pointer; }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
                                background: #fff; opacity: 0; transition: opacity .15s; }
  #seekrow:hover #seek::-webkit-slider-thumb { opacity: 1; }
  #seek::-moz-range-thumb { width: 12px; height: 12px; border: none; border-radius: 50%; background: #fff; }
  #volwrap { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  #vol { width: 90px; appearance: none; -webkit-appearance: none; height: 5px; border-radius: 3px;
         background: #33334d; cursor: pointer; }
  #vol::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #fff; }
  #vol::-moz-range-thumb { width: 11px; height: 11px; border: none; border-radius: 50%; background: #fff; }
  #logout { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 12px; }
  #logout:hover { color: #fff; }
  #toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
           background: #1e1e2c; border: 1px solid var(--line); color: #fff;
           padding: 10px 18px; border-radius: 999px; font-size: 14px; display: none;
           z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.5); white-space: nowrap; }

  #upnext { position: fixed; right: 14px; bottom: 96px; width: 300px; max-height: 46vh; overflow-y: auto;
            background: #1e1e2c; border: 1px solid var(--line); border-radius: 12px; padding: 10px;
            display: none; z-index: 90; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  #upnext h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim);
               padding: 4px 8px 8px; }
  #upnext .qitem { padding: 7px 8px; border-radius: 6px; font-size: 13px; cursor: pointer;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #upnext .qitem:hover { background: var(--panel2); }
  #upnext .qitem.cur { color: #c4b5fd; }

  @media (max-width: 760px) {
    #sidebar { position: fixed; top: 0; left: 0; bottom: 0; transform: translateX(-100%);
               transition: transform .25s; box-shadow: 0 0 40px rgba(0,0,0,.5); }
    #sidebar.open { transform: none; }
    #menuBtn { display: block; }
    #main { padding: 16px 14px 30px; }
    #player { grid-template-columns: 1fr; gap: 6px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
    #volwrap { display: none; }
    #now { order: 0; }
    #controls { order: 1; }
    .t-album, th.col-album { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="logo">🎵</div><b>{{ app_name }}</b></div>
    <button class="navbtn active" id="navHome">🏠&nbsp; Home</button>
    <button class="navbtn" id="navSearch">🔍&nbsp; Search</button>
    <button class="navbtn" id="navDl">⬇️&nbsp; Downloads <span id="dlCount" style="margin-left:auto;color:var(--dim);font-size:12px"></span></button>
    <div class="pl-head"><span>Playlists</span><button id="newPl">+ New</button></div>
    <div id="pllist"></div>
    <div style="margin-top:auto; padding: 10px;">
      <button id="logout" style="font-size:13px">Log out</button>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <button id="menuBtn">☰</button>
      <input id="search" placeholder="Search title, artist, album…" autocomplete="off">
    </div>
    <div class="vhead"><h2 id="viewTitle">All tracks</h2><button id="dlAllBtn" style="display:none">⬇ Download all</button></div>
    <div id="viewSub"></div>
    <div id="offlineBar" style="display:none;background:#3a2a10;border:1px solid #8a6a20;color:#ffd98a;padding:9px 14px;border-radius:10px;font-size:13px;margin-bottom:12px">📴 You're offline — showing your downloads.</div>
    <div id="trackwrap"></div>
  </main>
</div>

<div id="plmenu"></div>

<div id="upnext"><h4>Up next</h4><div id="qlist"></div></div>

<footer id="player">
  <div id="now">
    <div id="nowCover">♪</div>
    <div id="nowMeta">
      <div id="nowTitle">Nothing playing</div>
      <div id="nowArtist">Pick a track to start</div>
    </div>
  </div>
  <div id="controls">
    <div id="buttons">
      <button class="cbtn" id="shuffleBtn" title="Shuffle">🔀</button>
      <button class="cbtn" id="prevBtn" title="Previous">⏮</button>
      <button id="playBtn" title="Play/Pause">▶</button>
      <button class="cbtn" id="nextBtn" title="Next">⏭</button>
      <button class="cbtn" id="repeatBtn" title="Repeat">🔁</button>
      <button class="cbtn" id="queueBtn" title="Up next">☰</button>
    </div>
    <div id="seekrow">
      <span id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span id="tDur">0:00</span>
    </div>
  </div>
  <div id="volwrap">
    <span style="color:var(--dim)">🔊</span>
    <input type="range" id="vol" min="0" max="100" value="90">
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
const audio = new Audio();
audio.preload = "metadata";
audio.volume = 0.9;

let allTracks = [];        // full library
let viewTracks = [];       // tracks in current view
let viewName = "home", viewPid = null;
let queue = [], qi = -1;   // playback context
let shuffle = false, repeatMode = 0; // 0 off, 1 all, 2 one
let playOrder = [];        // shuffled index order
let lastCounted = null;

const GRADS = [
  "linear-gradient(135deg,#7c3aed,#06b6d4)", "linear-gradient(135deg,#f59e0b,#ef4444)",
  "linear-gradient(135deg,#10b981,#3b82f6)", "linear-gradient(135deg,#ec4899,#8b5cf6)",
  "linear-gradient(135deg,#06b6d4,#10b981)", "linear-gradient(135deg,#f97316,#eab308)",
];
function gradFor(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return GRADS[h % GRADS.length]; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(sec) { sec = Math.max(0, Math.floor(sec || 0));
  return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: {"Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = "/"; return null; }
  return r.json();
}

/* ---------------- library + views ---------------- */
async function loadTracks() {
  const d = await api("GET", "/api/tracks");
  if (!d) return;
  allTracks = d.tracks;
  applySearch();
}
function applySearch() {
  const q = $("#search").value.trim().toLowerCase();
  if (viewName === "playlist") return;
  const pool = viewName === "downloads" ? downloadsPool() : allTracks;
  viewTracks = q ? pool.filter(t =>
    (t.title + " " + t.artist + " " + (t.album || "")).toLowerCase().includes(q)) : pool.slice();
  if (viewName === "downloads") {
    renderView("⬇️ Downloads",
      viewTracks.length ? viewTracks.length + (viewTracks.length === 1 ? " track" : " tracks") + " available offline"
                        : "No downloads yet — tap ⬇ on any track while online.");
  } else {
    renderView("All tracks", viewTracks.length + (viewTracks.length === 1 ? " song" : " songs"));
  }
}
function renderView(title, sub) {
  $("#viewTitle").textContent = title;
  $("#viewSub").textContent = sub;
  updateDlButton();
  const w = $("#trackwrap");
  if (!viewTracks.length) {
    const msg = viewName === "downloads"
      ? 'No downloads yet.<br><span style="font-size:13px">Tap ⬇ on any track while you\'re online.</span>'
      : '🎵 No tracks here yet.<br><span style="font-size:13px">Ask the admin to upload some music.</span>';
    w.innerHTML = '<div class="empty">' + msg + '</div>';
    return;
  }
  const inPlaylist = viewName === "playlist";
  let html = '<table class="tracks"><thead><tr><th>#</th><th>Title</th>' +
    '<th class="col-album">Album</th><th>⏱</th><th></th></tr></thead><tbody>';
  viewTracks.forEach((t, i) => {
    const cur = queue[qi] && queue[qi].id === t.id;
    html += `<tr class="row${cur ? " playing" : ""}" data-i="${i}">` +
      `<td class="t-num">${cur ? "♪" : (i + 1)}</td>` +
      `<td><div class="t-title"><div class="mini-cover" style="background:${gradFor(t.title)}">${esc(t.title.trim()[0] || "♪").toUpperCase()}</div>` +
      `<div><div>${esc(t.title)}</div><div class="t-artist" style="font-weight:400;font-size:12px">${esc(t.artist)}</div></div></div></td>` +
      `<td class="t-album t-artist">${esc(t.album || "—")}</td>` +
      `<td class="t-dur">${fmt(t.duration)}</td>` +
      `<td style="text-align:right;white-space:nowrap">` +
      (inPlaylist ? `<button class="rmlink" data-rm="${t.id}">remove</button> ` : "") +
      `<button class="addbtn dlbtn" data-dl="${t.id}" title="Download for offline">⬇</button> ` +
      `<button class="addbtn" data-add="${t.id}" title="Add to playlist">+</button></td></tr>`;
  });
  w.innerHTML = html + "</tbody></table>";
  w.querySelectorAll("tr.row").forEach(tr => tr.addEventListener("click", e => {
    if (e.target.closest("[data-add]") || e.target.closest("[data-rm]") || e.target.closest("[data-dl]")) return;
    playContext(viewTracks, parseInt(tr.dataset.i, 10));
  }));
  w.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation(); openPlMenu(b, b.dataset.add);
  }));
  w.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation(); removeFromPlaylist(viewPid, b.dataset.rm);
  }));
  w.querySelectorAll("[data-dl]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation(); toggleDownload(b.dataset.dl);
  }));
  paintDlButtons();
}
async function showPlaylist(pid, name) {
  const d = await api("GET", "/api/playlists/" + pid);
  if (!d) return;
  viewName = "playlist"; viewPid = pid; viewTracks = d.tracks;
  document.querySelectorAll(".plitem").forEach(el =>
    el.classList.toggle("active", el.dataset.pid === pid));
  document.querySelectorAll(".navbtn").forEach(b => b.classList.remove("active"));
  renderView("🎶 " + d.name, d.tracks.length + (d.tracks.length === 1 ? " song" : " songs"));
  $("#sidebar").classList.remove("open");
}
function showHome() {
  if (!navigator.onLine) { showDownloads(); return; }
  viewName = "home"; viewPid = null;
  document.querySelectorAll(".plitem").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".navbtn").forEach(b => b.classList.remove("active"));
  $("#navHome").classList.add("active");
  applySearch();
  $("#sidebar").classList.remove("open");
}
async function removeFromPlaylist(pid, tid) {
  await api("DELETE", `/api/playlists/${pid}/tracks/${tid}`);
  showPlaylist(pid);
}

/* ---------------- playlists ---------------- */
async function loadPlaylists() {
  const d = await api("GET", "/api/playlists");
  if (!d) return;
  const w = $("#pllist");
  w.innerHTML = d.playlists.map(p =>
    `<div class="plitem" data-pid="${p.id}"><span>🎶</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>` +
    `<span style="color:var(--dim);font-size:11px">${p.count}</span>` +
    `<button class="x" data-del="${p.id}" title="Delete playlist">×</button></div>`).join("") ||
    '<div style="color:var(--dim);font-size:13px;padding:4px 10px">No playlists yet</div>';
  w.querySelectorAll(".plitem").forEach(el => el.addEventListener("click", e => {
    if (e.target.closest("[data-del]")) return;
    showPlaylist(el.dataset.pid);
  }));
  w.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async e => {
    e.stopPropagation();
    if (!confirm("Delete this playlist?")) return;
    await api("DELETE", "/api/playlists/" + b.dataset.del);
    if (viewPid === b.dataset.del) showHome(); else loadPlaylists();
  }));
}
$("#newPl").addEventListener("click", async () => {
  const name = prompt("Playlist name:");
  if (name === null) return;
  const d = await api("POST", "/api/playlists", { name: name || "New playlist" });
  if (d) { await loadPlaylists(); showPlaylist(d.id, d.name); }
});
function openPlMenu(anchor, tid) {
  const m = $("#plmenu");
  api("GET", "/api/playlists").then(d => {
    if (!d) return;
    m.innerHTML = d.playlists.map(p =>
      `<button data-p="${p.id}">${esc(p.name)}</button>`).join("") +
      `<button data-p="__new" style="color:var(--acc2)">+ New playlist</button>`;
    const r = anchor.getBoundingClientRect();
    m.style.display = "block";
    m.style.top = Math.min(innerHeight - m.offsetHeight - 10, r.bottom + 4) + "px";
    m.style.left = Math.max(8, Math.min(innerWidth - 210, r.left - 160)) + "px";
    m.querySelectorAll("button").forEach(b => b.addEventListener("click", async () => {
      m.style.display = "none";
      let pid = b.dataset.p;
      if (pid === "__new") {
        const name = prompt("Playlist name:"); if (name === null) return;
        const nd = await api("POST", "/api/playlists", { name: name || "New playlist" });
        if (!nd) return; pid = nd.id; loadPlaylists();
      }
      await api("POST", `/api/playlists/${pid}/tracks`, { track_id: tid });
      loadPlaylists();
    }));
  });
}
document.addEventListener("click", e => {
  if (!e.target.closest("#plmenu") && !e.target.closest("[data-add]"))
    $("#plmenu").style.display = "none";
  if (!e.target.closest("#upnext") && !e.target.closest("#queueBtn"))
    $("#upnext").style.display = "none";
});

/* ---------------- offline downloads ---------------- */
const TRACK_CACHE = "tunebox-tracks-v1";
const DL_KEY = "tb-downloads-v1";
const getDlIndex = () => { try { return JSON.parse(localStorage.getItem(DL_KEY) || "{}"); } catch (e) { return {}; } };
const setDlIndex = (idx) => { try { localStorage.setItem(DL_KEY, JSON.stringify(idx)); } catch (e) {} };
const blobUrls = {};   // id -> objectURL for this session
let lastBlobId = null;

function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = "none"; }, 2200);
}

function paintDlButtons() {
  const idx = getDlIndex();
  document.querySelectorAll("[data-dl]").forEach(b => {
    const dl = !!idx[b.dataset.dl];
    b.textContent = dl ? "✓" : "⬇";
    b.title = dl ? "Remove download" : "Download for offline";
    b.style.color = dl ? "var(--acc2)" : "";
    b.style.borderColor = dl ? "var(--acc2)" : "";
  });
  const n = Object.keys(idx).length;
  const el = document.getElementById("dlCount");
  if (el) el.textContent = n ? n : "";
}

function findTrack(id) {
  return allTracks.find(t => t.id === id)
      || viewTracks.find(t => t.id === id)
      || (() => { const d = getDlIndex()[id]; return d ? Object.assign({ id }, d) : null; })();
}

async function toggleDownload(id) {
  const idx = getDlIndex();
  if (idx[id]) {
    try { const c = await caches.open(TRACK_CACHE); await c.delete("/api/stream/" + id); } catch (e) {}
    if (blobUrls[id]) { URL.revokeObjectURL(blobUrls[id]); delete blobUrls[id]; }
    if (lastBlobId === id) lastBlobId = null;
    delete idx[id];
    setDlIndex(idx);
    paintDlButtons();
    if (viewName === "downloads") showDownloads();
    toast("Download removed");
    return;
  }
  const t = findTrack(id);
  if (!t) return;
  if (!navigator.onLine) { toast("You're offline — connect to download"); return; }
  toast("Downloading…");
  const ok = await cacheTrack(id);
  paintDlButtons();
  if (viewName === "downloads") showDownloads();
  toast(ok ? "Saved for offline ✓" : "Download failed — try again");
}

// Download one track's bytes into the offline cache. No UI churn; returns true/false.
async function cacheTrack(id) {
  const idx = getDlIndex();
  if (idx[id]) return true;
  const t = findTrack(id);
  if (!t) return false;
  try {
    const res = await fetch("/api/stream/" + id);
    if (!res.ok) throw new Error("bad response");
    const cache = await caches.open(TRACK_CACHE);
    await cache.put("/api/stream/" + id, res);
    idx[id] = { title: t.title, artist: t.artist, album: t.album || "",
                duration: t.duration || 0, at: Date.now() };
    setDlIndex(idx);
    return true;
  } catch (e) { return false; }
}

// Download every track in the current playlist view for offline listening.
async function downloadPlaylist(btn) {
  if (!navigator.onLine) { toast("You're offline — connect to download"); return; }
  const list = viewTracks.filter(t => !getDlIndex()[t.id]);
  if (!list.length) { toast("Already saved for offline ✓"); return; }
  btn.disabled = true;
  let done = 0, failed = 0;
  for (const t of list) {
    btn.textContent = "⬇ " + (done + 1) + "/" + list.length;
    if (await cacheTrack(t.id)) done++; else failed++;
  }
  btn.disabled = false;
  paintDlButtons();
  updateDlButton();
  toast(failed ? "Saved " + done + "/" + list.length + " (" + failed + " failed)"
               : "Playlist saved for offline ✓ (" + done + ")");
}

function updateDlButton() {
  const b = $("#dlAllBtn");
  if (!b) return;
  const show = viewName === "playlist" && viewTracks.length > 0;
  b.style.display = show ? "" : "none";
  if (show) {
    const idx = getDlIndex();
    const pending = viewTracks.filter(t => !idx[t.id]).length;
    b.textContent = pending ? "⬇ Download all" : "✓ Saved for offline";
    b.disabled = false;
  }
}
$("#dlAllBtn").addEventListener("click", e => downloadPlaylist(e.currentTarget));

async function offlineUrl(id) {
  if (blobUrls[id]) return blobUrls[id];
  try {
    const c = await caches.open(TRACK_CACHE);
    const m = await c.match("/api/stream/" + id);
    if (!m) return null;
    const blob = await m.blob();
    blobUrls[id] = URL.createObjectURL(blob);
    return blobUrls[id];
  } catch (e) { return null; }
}

function downloadsPool() {
  const idx = getDlIndex();
  return Object.keys(idx)
    .sort((a, b) => idx[b].at - idx[a].at)
    .map(id => Object.assign({ id, plays: 0 }, idx[id]));
}

function showDownloads() {
  viewName = "downloads"; viewPid = null;
  document.querySelectorAll(".plitem").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".navbtn").forEach(b => b.classList.remove("active"));
  document.getElementById("navDl").classList.add("active");
  applySearch();
  document.getElementById("sidebar").classList.remove("open");
}

function updateOnlineState() {
  const off = !navigator.onLine;
  document.getElementById("offlineBar").style.display = off ? "block" : "none";
  if (off && viewName !== "downloads") showDownloads();
}
window.addEventListener("online", updateOnlineState);
window.addEventListener("offline", updateOnlineState);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
  });
}

/* ---------------- playback ---------------- */
function buildOrder() {
  playOrder = queue.map((_, i) => i);
  if (shuffle) {
    const cur = playOrder[qi];
    playOrder = playOrder.filter(i => i !== qi);
    for (let i = playOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [playOrder[i], playOrder[j]] = [playOrder[j], playOrder[i]];
    }
    playOrder.unshift(qi);
  }
}
function playContext(list, i) {
  queue = list.slice(); qi = i; buildOrder();
  if (shuffle) qi = 0;
  startTrack();
}
async function startTrack() {
  const t = queue[qi];
  if (!t) return;
  const bu = await offlineUrl(t.id);
  if (lastBlobId && lastBlobId !== t.id && blobUrls[lastBlobId]) {
    URL.revokeObjectURL(blobUrls[lastBlobId]);
    delete blobUrls[lastBlobId];
  }
  lastBlobId = bu ? t.id : null;
  audio.src = bu || ("/api/stream/" + t.id);
  audio.play().catch(() => {});
  $("#nowTitle").textContent = t.title;
  $("#nowArtist").textContent = t.artist;
  $("#nowCover").textContent = (t.title.trim()[0] || "♪").toUpperCase();
  $("#nowCover").style.background = gradFor(t.title);
  $("#playBtn").textContent = "⏸";
  document.title = t.title + " · {{ app_name }}";
  if (lastCounted !== t.id) { lastCounted = t.id; api("POST", "/api/played/" + t.id); }
  renderQueue(); highlightRow();
}
function highlightRow() {
  document.querySelectorAll("tr.row").forEach(tr => {
    const t = viewTracks[parseInt(tr.dataset.i, 10)];
    const cur = t && queue[qi] && t.id === queue[qi].id;
    tr.classList.toggle("playing", !!cur);
    const num = tr.querySelector(".t-num");
    if (num) { num.textContent = cur ? "♪" : (parseInt(tr.dataset.i, 10) + 1); }
  });
}
function step(dir) {
  if (!queue.length) return;
  if (shuffle) {
    let pos = playOrder.indexOf(qi);
    pos += dir;
    if (pos >= playOrder.length) {
      if (repeatMode === 1) pos = 0; else { return; }
    }
    if (pos < 0) pos = playOrder.length - 1;
    qi = playOrder[pos];
  } else {
    qi += dir;
    if (qi >= queue.length) { if (repeatMode === 1) qi = 0; else { qi = queue.length - 1; return; } }
    if (qi < 0) qi = queue.length - 1;
  }
  startTrack();
}
audio.addEventListener("ended", () => {
  if (repeatMode === 2) { audio.currentTime = 0; audio.play().catch(() => {}); return; }
  const before = qi;
  step(1);
  if (qi === before && repeatMode === 0 && !shuffle) $("#playBtn").textContent = "▶";
});
audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    $("#seek").value = Math.floor(audio.currentTime / audio.duration * 1000);
    $("#tDur").textContent = fmt(audio.duration);
  }
  $("#tCur").textContent = fmt(audio.currentTime);
});
audio.addEventListener("play", () => { $("#playBtn").textContent = "⏸"; });
audio.addEventListener("pause", () => { $("#playBtn").textContent = "▶"; });
$("#playBtn").addEventListener("click", () => {
  if (!audio.src && queue.length) { qi = Math.max(0, qi); startTrack(); return; }
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
});
$("#nextBtn").addEventListener("click", () => step(1));
$("#prevBtn").addEventListener("click", () => {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  step(-1);
});
$("#seek").addEventListener("input", () => {
  if (audio.duration) audio.currentTime = $("#seek").value / 1000 * audio.duration;
});
$("#vol").addEventListener("input", e => { audio.volume = e.target.value / 100; });
$("#shuffleBtn").addEventListener("click", e => {
  shuffle = !shuffle;
  e.currentTarget.classList.toggle("on", shuffle);
  if (queue.length) buildOrder();
});
$("#repeatBtn").addEventListener("click", e => {
  repeatMode = (repeatMode + 1) % 3;
  const b = e.currentTarget;
  b.classList.toggle("on", repeatMode > 0);
  b.textContent = repeatMode === 2 ? "🔂" : "🔁";
  b.title = ["Repeat off", "Repeat all", "Repeat one"][repeatMode];
});
function renderQueue() {
  const items = [];
  const order = shuffle ? playOrder : queue.map((_, i) => i);
  const pos = order.indexOf(qi);
  for (let k = pos; k < Math.min(order.length, pos + 20); k++) {
    const t = queue[order[k]];
    items.push(`<div class="qitem${k === pos ? " cur" : ""}" data-q="${order[k]}">${esc(t.title)} <span style="color:var(--dim)">· ${esc(t.artist)}</span></div>`);
  }
  $("#qlist").innerHTML = items.join("") || '<div class="qitem">Queue is empty</div>';
  $("#qlist").querySelectorAll(".qitem[data-q]").forEach(el =>
    el.addEventListener("click", () => { qi = parseInt(el.dataset.q, 10); startTrack(); }));
}
$("#queueBtn").addEventListener("click", () => {
  const u = $("#upnext");
  u.style.display = u.style.display === "block" ? "none" : "block";
  if (u.style.display === "block") renderQueue();
});

/* ---------------- nav ---------------- */
$("#navHome").addEventListener("click", showHome);
$("#navDl").addEventListener("click", showDownloads);
$("#navSearch").addEventListener("click", () => { if (!navigator.onLine) { showDownloads(); return; } showHome(); $("#search").focus(); });
$("#search").addEventListener("input", applySearch);
$("#menuBtn").addEventListener("click", () => $("#sidebar").classList.toggle("open"));
$("#logout").addEventListener("click", () => { location.href = "/logout"; });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); $("#playBtn").click(); }
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});

loadTracks();
loadPlaylists();
paintDlButtons();
updateOnlineState();
</script>
</body>
</html>
