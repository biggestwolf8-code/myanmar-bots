<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ app_name }} — Private Music</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; color: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #14141c; border: 1px solid #26263a; border-radius: 16px; padding: 40px 36px;
          width: 100%; max-width: 380px; text-align: center; }
  .logo { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 18px;
          background: linear-gradient(135deg, #7c3aed, #06b6d4);
          display: flex; align-items: center; justify-content: center; font-size: 30px; }
  h1 { font-size: 26px; margin-bottom: 6px; }
  p.sub { color: #9a9ab0; font-size: 14px; margin-bottom: 24px; }
  input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid #33334d;
          background: #0d0d14; color: #fff; font-size: 16px; text-align: center;
          letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
  input:focus { outline: none; border-color: #7c3aed; }
  button { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 16px;
           font-weight: 700; color: #fff; cursor: pointer;
           background: linear-gradient(135deg, #7c3aed, #06b6d4); }
  button:active { transform: scale(.98); }
  .err { background: #3d1420; border: 1px solid #7f2d3f; color: #ff9db0;
         padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🎵</div>
    <h1>{{ app_name }}</h1>
    <p class="sub">Private music streaming.<br>Enter your invite code to listen.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input name="code" placeholder="INVITE CODE" maxlength="16" autocomplete="off" required>
      <button type="submit">Start listening</button>
    </form>
  </div>
</body>
</html>
