<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Envato Elements — Login</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f7f7f7;color:#333;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;padding:40px;border-radius:12px;width:360px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.logo{font-size:26px;font-weight:800;margin-bottom:6px}.logo span{color:#82b440}
.sub{color:#888;font-size:14px;margin-bottom:20px}
input{width:100%;padding:13px;margin:8px 0;border:2px solid #e5e5e5;border-radius:8px;font-size:16px;text-align:center;letter-spacing:3px;outline:none}
input:focus{border-color:#82b440}
button{width:100%;padding:13px;margin-top:8px;border:0;border-radius:8px;background:#82b440;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:hover{background:#6fa033}
.err{color:#d44;font-size:13px;min-height:20px}
</style></head>
<body><div class="card">
<div class="logo">envato<span>elements</span></div>
<div class="sub">Enter your invite code to continue</div>
<div class="err">{{ err }}</div>
<form method="post"><input name="code" placeholder="XXXXXXXX" autocomplete="off" autofocus maxlength="8">
<button type="submit">Continue</button></form>
</div></body></html>
