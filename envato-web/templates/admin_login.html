<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin login</title>
<style>body{font-family:system-ui;background:#141414;color:#eee;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#1e1e1e;padding:28px;border-radius:10px;width:300px}input{width:100%;box-sizing:border-box;padding:10px;margin:10px 0;background:#111;border:1px solid #444;color:#fff;border-radius:6px}
button{width:100%;padding:10px;background:#87e64b;border:0;border-radius:6px;font-weight:700;cursor:pointer}.err{color:#f77;font-size:13px}</style></head>
<body><div class="card"><h3>Admin</h3><div class="err">{{ err }}</div>
<form method="post"><input type="password" name="pw" placeholder="Password" autofocus><button>Login</button></form></div></body></html>
