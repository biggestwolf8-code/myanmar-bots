<!doctype html>
<html><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Envato Elements Unlimited — Sign up</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f7f7f7;color:#333;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;padding:40px;border-radius:12px;width:380px;box-shadow:0 2pxpx 12px rgba(0,0,0,.08)}
.logo{font-size:26px;font-weight:800;margin-bottom:6px;text-align:center}.logo span{color:#82b440}
.sub{color:#888;font-size:14px;margin-bottom:20px;text-align:center}
input{width:100%;padding:13px;margin:8px 0;border:2px solid #e5e5e5;border-radius:8px;font-size:15px;outline:none}
input:focus{border-color:#82b440}
button{width:100%;padding:13px;margin-top:8px;border:0;border-radius:8px;background:#82b440;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:hover{background:#6fa033}
.err{color:#d44;font-size:13px;min-height:20px;text-align:center}
.foot{text-align:center;margin-top:16px;font-size:14px;color:#888}
.foot a{color:#82b440;text-decoration:none;font-weight:600}
</style></head>
<body><div class="card">
<div class="logo">Envato <span>Elements Unlimited</span></div>
<div class="sub">Create your account — invite code required</div>
<div class="err">{{ err }}</div>
<form method="post">
  <input name="code" type="text" placeholder="Invite code" autocomplete="off" autofocus style="text-transform:uppercase">
  <input name="email" type="email" placeholder="Email address" autocomplete="email">
  <input name="password" type="password" placeholder="Password (min 6 chars)" autocomplete="new-password">
  <input name="password2" type="password" placeholder="Confirm password" autocomplete="new-password">
  <button type="submit">Sign up</button>
</form>
<div class="foot">Invite codes are created by the app owner in the admin panel.<br>Have an account? <a href="/login">Log in</a></div>
</div></body></html>
